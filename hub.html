<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CITADEL — Live Hub</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#eef4ff;background:#071018}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#173446,#071018 48%);padding:24px}main{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.brand{color:#72e4b4;font-weight:900;letter-spacing:.16em;font-size:13px}h1{font-size:clamp(34px,6vw,68px);line-height:.96;margin:14px 0}p{color:#9cb0bf}.status{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:#55e6a5;box-shadow:0 0 18px #55e6a5}.summary{margin:34px 0 18px;padding:18px;border:1px solid #244453;border-radius:18px;background:#0c1b26}.summary b{font-size:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.node{padding:18px;border:1px solid #254654;border-radius:18px;background:#0d1c27;box-shadow:0 14px 34px #0005}.node.online{border-color:#267855}.node h2{margin:0 0 12px}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#173544;color:#b9d9e7;font-size:12px}.online .pill{background:#124532;color:#8df3bd}.meta{margin-top:14px;color:#91a8b7;font-size:13px;line-height:1.7}.empty{padding:30px;border:1px dashed #355262;border-radius:18px;color:#9cb0bf;text-align:center}a{color:#8be8bc}footer{margin:32px 0;color:#6f8795;font-size:13px}@media(max-width:650px){.top{display:block}.status{margin-top:16px}}
  </style>
</head>
<body>
  <main>
    <div class="top"><div><div class="brand">CITADEL / LIVE HUB</div><h1>Подключённые<br>компьютеры</h1></div><div class="status"><span class="dot"></span><span id="refreshState">Связь с Controller</span></div></div>
    <p>Новый агент регистрируется автоматически и появляется здесь без ручного подтверждения.</p>
    <div class="summary"><b id="onlineCount">0</b> online · <span id="totalCount">0</span> зарегистрировано</div>
    <section id="nodes" class="grid" aria-live="polite"></section>
    <footer>Обновление каждые 10 секунд · <a href="/architect/">Защищённая панель архитектора</a></footer>
  </main>
  <script>
    const nodes = document.getElementById("nodes");
    const escapeText = (value) => String(value ?? "—");
    function card(node) {
      const el = document.createElement("article");
      el.className = `node ${node.status === "online" ? "online" : ""}`;
      const title = document.createElement("h2"); title.textContent = node.display_name;
      const pill = document.createElement("span"); pill.className = "pill"; pill.textContent = node.status;
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = `Агент: ${escapeText(node.agent_version)}\nПоследняя связь: ${escapeText(node.last_seen_at)}`;
      meta.style.whiteSpace = "pre-line";
      el.append(title, pill, meta); return el;
    }
    async function refresh() {
      try {
        const response = await fetch("/api/v1/hub/nodes", {cache:"no-store"});
        const data = await response.json(); if (!response.ok) throw new Error(data.error || response.status);
        nodes.replaceChildren(...data.nodes.map(card));
        if (!data.nodes.length) { const empty=document.createElement("div"); empty.className="empty"; empty.textContent="Узлы пока не подключены."; nodes.append(empty); }
        document.getElementById("totalCount").textContent = data.nodes.length;
        document.getElementById("onlineCount").textContent = data.nodes.filter(n=>n.status==="online").length;
        document.getElementById("refreshState").textContent = `Обновлено ${new Date().toLocaleTimeString()}`;
      } catch (error) { document.getElementById("refreshState").textContent = `Нет связи: ${error.message}`; }
    }
    refresh(); setInterval(refresh, 10000);
  </script>
</body>
</html>
