name: Bounded agent update evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/rollout_evidence.mjs
      - .github/workflows/rollout-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify diagnostic boundaries
        run: node tests/rollout-evidence.mjs
      - name: Read bounded evidence and close the diagnostic pause
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
          CITADEL_DIAGNOSTIC_RESUME_NODE_HASH: 45cb5f42434ef6c0c4fdbdde894b57a72b39ea73b1cc4402d16b09742ee15bb9
        run: node scripts/rollout_evidence.mjs
