name: D1 Capacity Check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Cloudflare TEST"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 6 * * *"

permissions:
  contents: read
  checks: write

concurrency:
  group: d1-capacity-check
  cancel-in-progress: false

jobs:
  capacity:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Read capacity and daily cleanup counters
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CITADEL_CHECK_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/d1_capacity_check.mjs
