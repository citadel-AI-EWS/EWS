name: CI

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: pip-audit --requirement agent/requirements.txt
      - run: scripts/validate.sh
      - run: npm run build && npm run check:cloudflare
      - run: bandit -q controller_app.py agent/citadel_node_v1.py agent/citadel_node_v2.py
      - run: node --check scripts/smoke_test.mjs
      - run: node --check scripts/synthetic_user.mjs

  agent-package:
    name: Agent packages integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Verify Windows x86 dependency wheels exist
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --platform win32 --python-version 313 --implementation cp
          --abi cp313 --abi abi3
          --requirement agent/requirements-win32.txt
          --dest .tmp-win32-wheels
      - name: Verify Windows ARM64 dependency wheels exist
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --platform win_arm64 --python-version 313 --implementation cp
          --abi cp313 --abi abi3
          --requirement agent/requirements.txt
          --dest .tmp-win-arm64-wheels
      - name: Verify Linux x86_64 dependency wheels exist
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --platform manylinux2014_x86_64 --python-version 310 --implementation cp
          --abi cp310 --abi abi3
          --requirement agent/requirements.txt
          --dest .tmp-linux-x86_64-wheels
      - name: Verify Linux ARM64 dependency wheels exist
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --platform manylinux2014_aarch64 --python-version 310 --implementation cp
          --abi cp310 --abi abi3
          --requirement agent/requirements.txt
          --dest .tmp-linux-arm64-wheels
      - name: Build self-contained Windows package
        run: python scripts/build_fixed_agent_package.py
      - name: Verify generated package
        run: |
          set -euo pipefail
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_FIXED_AGENT_*' | head -n 1)"
          package_zip="${package_dir}.zip"
          test -n "$package_dir"
          test -f "$package_zip"
          python -m py_compile "$package_dir/citadel_node_v1.py" "$package_dir/citadel_node_v2.py"
          python "$package_dir/citadel_node_v2.py" self-test
          python - "$package_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          manifest = root / "SHA256SUMS.txt"
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "requirements.txt",
              "requirements-win32.txt", "setup_windows.ps1", "Install Windows Node.cmd", "START_HERE.cmd",
              "README_RU.txt", "VERIFY_PACKAGE.ps1"
          }
          assert required <= seen, sorted(required - seen)
          installer = (root / "Install Windows Node.cmd").read_text(encoding="utf-8").lower()
          assert "executionpolicy bypass" not in installer
          print("Agent package integrity: OK")
          PY
          unzip -t "$package_zip"

      - name: Build self-contained Linux package
        run: python scripts/build_fixed_linux_agent_package.py
      - name: Verify Linux packages
        run: |
          set -euo pipefail
          for spec in             "CITADEL_LINUX_X86_64_AGENT_0.3.11_COMPAT1:x86_64"             "CITADEL_LINUX_ARM64_AGENT_0.3.11_COMPAT1:arm64"
          do
            package_name="${spec%%:*}"
            expected_arch="${spec##*:}"
            linux_dir="dist/$package_name"
            linux_tar="$linux_dir.tar.gz"
            test -d "$linux_dir"
            test -f "$linux_tar"
            test "$(tr -d '[:space:]' < "$linux_dir/TARGET_ARCH")" = "$expected_arch"
            bash -n "$linux_dir/setup_linux.sh" "$linux_dir/Install Linux Node.sh" "$linux_dir/START_HERE.sh"
            python -m py_compile "$linux_dir/citadel_node_v1.py" "$linux_dir/citadel_node_v2.py"
            python "$linux_dir/citadel_node_v2.py" self-test
            python - "$linux_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "requirements.txt",
              "setup_linux.sh", "Install Linux Node.sh", "START_HERE.sh",
              "README_LINUX.md", "TARGET_ARCH"
          }
          assert required <= seen, sorted(required - seen)
          setup = (root / "setup_linux.sh").read_text(encoding="utf-8").lower()
          assert "curl |" not in setup
          assert "wget |" not in setup
          assert "eval " not in setup
          assert "--only-binary=:all:" in setup
          print("Linux package integrity: OK")
          PY
            tar -tzf "$linux_tar" >/dev/null
          done

  linux_agent_compat:
    name: Linux agent Python compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install binary-only agent dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --requirement agent/requirements.txt
      - name: Compile and self-test agent
        run: |
          python -m py_compile agent/citadel_node_v1.py agent/citadel_node_v2.py
          python agent/citadel_node_v2.py self-test
      - name: Parse Linux installer
        run: bash -n agent/setup_linux.sh "agent/Install Linux Node.sh"

  windows-agent:
    name: Windows agent validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Compile and self-test agent
        shell: pwsh
        run: |
          python -m py_compile agent/citadel_node_v1.py agent/citadel_node_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python agent/citadel_node_v2.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell installer and enforce policy
        shell: pwsh
        run: |
          $setup = Get-Content -LiteralPath "agent/setup_windows.ps1" -Raw
          [void][ScriptBlock]::Create($setup)
          $installer = (Get-Content -LiteralPath "agent/Install Windows Node.cmd" -Raw).ToLowerInvariant()
          if ($installer.Contains("executionpolicy bypass")) { throw "ExecutionPolicy Bypass is forbidden" }
          if ($setup.ToLowerInvariant().Contains("executionpolicy bypass")) { throw "ExecutionPolicy Bypass is forbidden" }
          if (-not $setup.Contains("Install-PythonFallback")) { throw "Verified Python fallback is missing" }
          if (-not $setup.Contains("requirements-win32.txt")) { throw "Windows x86 dependency selection is missing" }
          if ($setup.Contains("Python 3.14 is not installed and Windows Package Manager (winget) is unavailable")) { throw "winget is still mandatory" }
          Write-Host "Windows installer policy: OK"

  gate:
    name: CI gate
    if: always()
    needs: [validate-linux, agent-package, linux_agent_compat, windows-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.validate-linux.result }}" = "success"
          test "${{ needs.agent-package.result }}" = "success"
          test "${{ needs.linux_agent_compat.result }}" = "success"
          test "${{ needs.windows-agent.result }}" = "success"
          echo "All CI gates passed."
