name: CI

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: pip-audit --requirement agent/requirements.txt
      - run: scripts/validate.sh
      - run: npm run build && npm run check:cloudflare
      - run: bandit -q controller_app.py agent/citadel_node_v1.py agent/citadel_node_v2.py
      - run: node --check scripts/smoke_test.mjs
      - run: node --check scripts/synthetic_user.mjs

  agent-package:
    name: Agent packages integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Build self-contained Windows package
        run: python scripts/build_fixed_agent_package.py
      - name: Verify generated package
        run: |
          set -euo pipefail
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_FIXED_AGENT_*' | head -n 1)"
          package_zip="${package_dir}.zip"
          test -n "$package_dir"
          test -f "$package_zip"
          python -m py_compile "$package_dir/citadel_node_v1.py" "$package_dir/citadel_node_v2.py"
          python "$package_dir/citadel_node_v2.py" self-test
          python - "$package_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          manifest = root / "SHA256SUMS.txt"
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "setup_windows.ps1", "setup_windows_local.py", "Install Windows Node.cmd",
              "Install Windows Service.cmd", "START_HERE.cmd", "Uninstall Local Agent.cmd",
              "CitadelNodeService.cs", "windows_service.ps1", "README_RU.txt", "VERIFY_PACKAGE.ps1",
              "python-runtime-amd64/python.exe", "python-runtime-win32/python.exe",
              "python-runtime-arm64/python.exe"
          }
          assert required <= seen, sorted(required - seen)
          installer = (root / "Install Windows Node.cmd").read_text(encoding="utf-8").lower()
          assert "executionpolicy bypass" not in installer
          assert "powershell" not in installer
          assert "winget" not in installer
          assert "setup_windows_local.py" in installer
          local_setup = (root / "setup_windows_local.py").read_text(encoding="utf-8").lower()
          assert "powershell" not in local_setup
          assert "winget" not in local_setup
          print("Agent package integrity: OK")
          PY
          unzip -t "$package_zip"

      - name: Build self-contained Linux package
        run: python scripts/build_fixed_linux_agent_package.py
      - name: Verify Linux package
        run: |
          set -euo pipefail
          linux_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_LINUX_AGENT_*' | head -n 1)"
          linux_tar="${linux_dir}.tar.gz"
          test -n "$linux_dir"
          test -f "$linux_tar"
          bash -n "$linux_dir/setup_linux.sh" "$linux_dir/Install Linux Node.sh" "$linux_dir/START_HERE.sh"
          python -m py_compile "$linux_dir/citadel_node_v1.py" "$linux_dir/citadel_node_v2.py"
          python "$linux_dir/citadel_node_v2.py" self-test
          python - "$linux_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "setup_linux.sh", "Install Linux Node.sh", "START_HERE.sh",
              "README_LINUX.md"
          }
          assert required <= seen, sorted(required - seen)
          setup = (root / "setup_linux.sh").read_text(encoding="utf-8").lower()
          assert "curl |" not in setup
          assert "wget |" not in setup
          assert "eval " not in setup
          print("Linux package integrity: OK")
          PY
          tar -tzf "$linux_tar" >/dev/null

  windows-agent:
    name: Windows agent validation
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Compile and self-test agent
        shell: pwsh
        run: |
          python -m py_compile agent/citadel_node_v1.py agent/citadel_node_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python agent/citadel_node_v2.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise bundled Local Agent runtime
        shell: pwsh
        run: |
          python scripts/build_fixed_agent_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkg = Get-ChildItem -LiteralPath "dist" -Directory | Where-Object { $_.Name -like "CITADEL_FIXED_AGENT_0.3.16_*" } | Select-Object -First 1
          if (-not $pkg) { throw "0.3.16 Windows package directory not found" }
          $runtime = Join-Path $pkg.FullName "python-runtime-amd64\python.exe"
          if (-not (Test-Path -LiteralPath $runtime)) { throw "bundled AMD64 Python runtime missing" }
          & $runtime (Join-Path $pkg.FullName "citadel_node_v2.py") self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installRoot = Join-Path $env:RUNNER_TEMP "Citadel Local Agent"
          $stateRoot = Join-Path $env:RUNNER_TEMP "Citadel Local State"
          & $runtime (Join-Path $pkg.FullName "setup_windows_local.py") --install-root $installRoot --state-root $stateRoot --no-start --no-autostart --skip-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedPython = Join-Path $installRoot "python-runtime\python.exe"
          $installedAgent = Join-Path $installRoot "citadel_node_v2.py"
          if (-not (Test-Path -LiteralPath $installedPython)) { throw "installed local runtime missing" }
          & $installedPython $installedAgent self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $runtime (Join-Path $pkg.FullName "setup_windows_local.py") --install-root $installRoot --state-root $stateRoot --uninstall --purge-state
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $installRoot) { throw "local uninstall left install root" }
          if (Test-Path -LiteralPath $stateRoot) { throw "local uninstall left state root" }
          Write-Host "Bundled Local Agent install/self-test/uninstall: OK"

      - name: Validate Windows Enterprise Probe and legacy-upgrade bootstrap
        shell: pwsh
        run: |
          $probePath = (Resolve-Path -LiteralPath "agent\windows_enterprise_probe.ps1").Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($probePath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }

          $probeJson = & powershell.exe -NoLogo -NoProfile -NonInteractive -File $probePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = $probeJson | ConvertFrom-Json
          if ($probe.schema -ne "citadel.windows.enterprise.v1") { throw "Unexpected enterprise probe schema" }
          if ($probe.readonly -ne $true) { throw "Enterprise probe must be read-only" }

          $legacyUpgrade = Join-Path $env:RUNNER_TEMP "citadel-legacy-upgrade"
          New-Item -ItemType Directory -Force -Path $legacyUpgrade | Out-Null
          Copy-Item -LiteralPath "agent\citadel_node_v1.py" -Destination $legacyUpgrade
          Copy-Item -LiteralPath "agent\citadel_node_v2.py" -Destination $legacyUpgrade
          Push-Location $legacyUpgrade
          try {
            python .\citadel_node_v2.py self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $restored = Join-Path $legacyUpgrade "windows_enterprise_probe.ps1"
            if (-not (Test-Path -LiteralPath $restored)) { throw "Embedded enterprise probe was not restored" }
            $expected = "0d056ab71e2216821cd314a97bc14e87f87c60140a0bcf787a24cfa33212c2ee"
            $actual = (Get-FileHash -LiteralPath $restored -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Restored enterprise probe hash mismatch" }
          } finally {
            Pop-Location
          }
          Write-Host "Windows Enterprise Probe AST/runtime/bootstrap: OK"
      - name: Compile Windows SCM service host
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"),
            (Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe")
          )
          $csc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $csc) { throw ".NET Framework csc.exe not found" }
          $out = Join-Path $env:RUNNER_TEMP "CitadelNodeService.exe"
          $source = (Resolve-Path -LiteralPath "agent\CitadelNodeService.cs").Path
          & $csc /nologo /optimize+ /target:winexe "/out:$out" /reference:System.ServiceProcess.dll $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $out --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Windows service host compile/self-test: OK"
      - name: Validate installer AST and real SCM configuration
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $setupPath = (Resolve-Path -LiteralPath "agent\setup_windows.ps1").Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($setupPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $commands = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() })
          foreach ($required in @(
            "Set-CitadelDirectoryAcl",
            "Set-CitadelServiceDefinition",
            "Set-CitadelServiceRecovery",
            "Start-Service",
            "Get-CimInstance",
            "Remove-CitadelServiceDefinition"
          )) {
            if ($commands -notcontains $required) { throw "Active installer command missing: $required" }
          }

          $installer = (Get-Content -LiteralPath "agent/Install Windows Node.cmd" -Raw).ToLowerInvariant()
          $setupLower = (Get-Content -LiteralPath $setupPath -Raw).ToLowerInvariant()
          if ($installer.Contains("executionpolicy bypass") -or $setupLower.Contains("executionpolicy bypass")) {
            throw "ExecutionPolicy Bypass is forbidden"
          }
          if ($setupLower.Contains("createshortcut(") -or $setupLower.Contains("pythonw.exe")) {
            throw "Legacy Startup lifecycle returned"
          }

          . (Resolve-Path -LiteralPath "agent\windows_service.ps1").Path
          $testName = "CitadelEwsCi" + ([Guid]::NewGuid().ToString("N").Substring(0, 8))
          $testDir = Join-Path $env:RUNNER_TEMP "Citadel Service Path Test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $mockExe = Join-Path $testDir "Mock Service.exe"
          Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32\cmd.exe") -Destination $mockExe -Force
          $imagePath = '"' + $mockExe + '" /c exit 0'
          try {
            $configured = Set-CitadelServiceDefinition -Name $testName -DisplayName "CITADEL CI SCM Test" -BinaryPathName $imagePath -StartName "NT AUTHORITY\LocalService" -DelayedAutoStart $true
            if ([string]$configured.PathName -ne $imagePath) { throw "SCM ImagePath round-trip failed" }
            if ([string]$configured.StartMode -ne "Auto") { throw "SCM StartMode round-trip failed" }
            if ([string]$configured.StartName -ne "NT AUTHORITY\LocalService") { throw "SCM account round-trip failed" }
            $reg = Get-ItemProperty -LiteralPath ("HKLM:\SYSTEM\CurrentControlSet\Services\" + $testName) -Name DelayedAutostart
            if ([int]$reg.DelayedAutostart -ne 1) { throw "SCM delayed-auto round-trip failed" }
          } finally {
            Remove-CitadelServiceDefinition -Name $testName
          }
          Write-Host "Windows installer AST + real SCM round-trip: OK"

  gate:
    name: CI gate
    if: always()
    needs: [validate-linux, agent-package, windows-agent]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.validate-linux.result }}" = "success"
          test "${{ needs.agent-package.result }}" = "success"
          test "${{ needs.windows-agent.result }}" = "success"
          echo "All CI gates passed."
