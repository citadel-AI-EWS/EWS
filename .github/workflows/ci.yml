name: CI

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: python -m pip install --requirement requirements-dev.txt
      - run: scripts/validate.sh
      - run: npm run build && npm run check:cloudflare
      - run: bandit -q controller_app.py agent/citadel_node_v1.py agent/citadel_node_v2.py

  deploy-r2-test:
    needs: validate
    if: github.event_name == 'pull_request' && github.head_ref == 'work/storage-tiering-r2-v1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: scripts/build_site.sh
      - name: Ensure TEST R2 bucket and D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! npx wrangler r2 bucket info citadel-reports-test --json > /tmp/citadel-r2.json; then
            npx wrangler r2 bucket create citadel-reports-test
          fi
          npx wrangler r2 bucket info citadel-reports-test --json
          npx wrangler d1 migrations apply citadel-control --remote
      - name: Deploy TEST site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            ARCHITECT_TOKEN_HASH
            CONTROLLER_COMMAND_PRIVATE_JWK
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
      - name: Verify TEST R2 controls
        run: |
          for attempt in $(seq 1 20); do
            response="$(curl --fail --silent --show-error "https://citadel-ai.init1.workers.dev/api/health?deployment=${GITHUB_SHA}-${attempt}")"
            if node -e 'const value = JSON.parse(process.argv[1]); process.exit(value.ok && value.controller_signing === "ready" && value.report_storage === "ready" && value.session_storage === "ready" && value.telemetry_storage === "ready" && value.report_tiering_schema === "ready" && value.report_r2 === "ready" ? 0 : 1)' "$response"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
