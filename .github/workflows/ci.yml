name: CI

on:
  push:
    branches: [main, work]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Ensure zip is available
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            timeout 180s sudo apt-get update
            timeout 180s sudo apt-get install -y zip
          fi
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - run: pip-audit --requirement agent/requirements.txt
      - run: scripts/validate.sh
      - run: npm run build && npm run check:cloudflare
      - run: bandit -q controller_app.py agent/citadel_node_v1.py agent/citadel_node_v2.py
      - run: node --check scripts/smoke_test.mjs
      - run: node --check scripts/synthetic_user.mjs

  ssh-terminal-browser:
    name: SSH terminal browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: scripts/build_site.sh
      - run: node tests/ssh-terminal-e2e.mjs --browser
      - run: node tests/ssh-relay-workerd.mjs --browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ssh-terminal-browser-${{ github.run_id }}
          path: /tmp/citadel-ssh-terminal-mobile.png
          if-no-files-found: ignore
          retention-days: 14

  agent-package:
    name: Agent packages integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Build self-contained Windows package
        run: python scripts/build_fixed_agent_package.py
      - name: Verify generated package
        run: |
          set -euo pipefail
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_FIXED_AGENT_*' | head -n 1)"
          package_zip="${package_dir}.zip"
          test -n "$package_dir"
          test -f "$package_zip"
          python -m py_compile "$package_dir/citadel_node_v1.py" "$package_dir/citadel_node_v2.py"
          python "$package_dir/citadel_node_v2.py" self-test
          python - "$package_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          manifest = root / "SHA256SUMS.txt"
          seen = set()
          for line in manifest.read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "setup_windows.ps1", "Install Windows Node.cmd", "START_HERE.cmd",
              "CitadelNodeService.cs", "windows_service.ps1", "README_RU.txt", "VERIFY_PACKAGE.ps1"
          }
          assert required <= seen, sorted(required - seen)
          installer = (root / "Install Windows Node.cmd").read_text(encoding="utf-8").lower()
          assert "executionpolicy bypass" not in installer
          print("Agent package integrity: OK")
          PY
          unzip -t "$package_zip"

      - name: Build self-contained Linux package
        run: python scripts/build_fixed_linux_agent_package.py
      - name: Verify Linux package
        run: |
          set -euo pipefail
          linux_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_LINUX_AGENT_*' | head -n 1)"
          linux_tar="${linux_dir}.tar.gz"
          test -n "$linux_dir"
          test -f "$linux_tar"
          bash -n "$linux_dir/setup_linux.sh" "$linux_dir/Install Linux Node.sh" "$linux_dir/START_HERE.sh"
          python -m py_compile "$linux_dir/citadel_node_v1.py" "$linux_dir/citadel_node_v2.py"
          python "$linux_dir/citadel_node_v2.py" self-test
          python - "$linux_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "setup_linux.sh", "Install Linux Node.sh", "START_HERE.sh",
              "README_LINUX.md"
          }
          assert required <= seen, sorted(required - seen)
          setup = (root / "setup_linux.sh").read_text(encoding="utf-8").lower()
          assert "curl |" not in setup
          assert "wget |" not in setup
          assert "eval " not in setup
          print("Linux package integrity: OK")
          PY
          tar -tzf "$linux_tar" >/dev/null

  windows-agent:
    name: Windows agent validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Compile and self-test agent
        shell: pwsh
        run: |
          python -m py_compile agent/citadel_node_v1.py agent/citadel_node_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/powershell-output.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/staged-self-test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python agent/citadel_node_v2.py self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agent-resilience.py
          python tests/node-relay-hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agent-quota-retry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/ssh-relay-agent.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/lmstudio-version-compat.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/agent-cycle-isolation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/legacy-update-activation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows Enterprise Probe and legacy-upgrade bootstrap
        shell: pwsh
        run: |
          $probePath = (Resolve-Path -LiteralPath "agent\windows_enterprise_probe.ps1").Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($probePath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }

          $probeJson = & powershell.exe -NoLogo -NoProfile -NonInteractive -File $probePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = $probeJson | ConvertFrom-Json
          if ($probe.schema -ne "citadel.windows.enterprise.v1") { throw "Unexpected enterprise probe schema" }
          if ($probe.readonly -ne $true) { throw "Enterprise probe must be read-only" }

          $legacyUpgrade = Join-Path $env:RUNNER_TEMP "citadel-legacy-upgrade"
          New-Item -ItemType Directory -Force -Path $legacyUpgrade | Out-Null
          Copy-Item -LiteralPath "agent\citadel_node_v1.py" -Destination $legacyUpgrade
          Copy-Item -LiteralPath "agent\citadel_node_v2.py" -Destination $legacyUpgrade
          Push-Location $legacyUpgrade
          try {
            python .\citadel_node_v2.py self-test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $restored = Join-Path $legacyUpgrade "windows_enterprise_probe.ps1"
            if (-not (Test-Path -LiteralPath $restored)) { throw "Embedded enterprise probe was not restored" }
            $expected = "0d056ab71e2216821cd314a97bc14e87f87c60140a0bcf787a24cfa33212c2ee"
            $actual = (Get-FileHash -LiteralPath $restored -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Restored enterprise probe hash mismatch" }
          } finally {
            Pop-Location
          }
          Write-Host "Windows Enterprise Probe AST/runtime/bootstrap: OK"
      - name: Compile and exercise restricted SSH console
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"),
            (Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe")
          )
          $csc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $csc) { throw ".NET Framework csc.exe not found" }
          $out = Join-Path $env:RUNNER_TEMP "CitadelSshConsole.exe"
          $source = (Resolve-Path -LiteralPath "agent\CitadelSshConsole.cs").Path
          & $csc /nologo /optimize+ /target:exe "/out:$out" /reference:System.Management.dll /reference:System.ServiceProcess.dll $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sourceText = Get-Content -LiteralPath $source -Raw
          if ($sourceText.Contains("Process.Start(") -or $sourceText.Contains("UseShellExecute")) {
            throw "Restricted SSH console must not spawn child processes"
          }

          $env:SSH_ORIGINAL_COMMAND = "help"
          $help = & $out 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $help.Contains("Allowed commands:")) { throw "Restricted SSH help failed" }

          foreach ($allowed in @("hostname", "whoami")) {
            $env:SSH_ORIGINAL_COMMAND = $allowed
            $text = & $out 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or -not $text.Trim()) {
              throw "Restricted SSH console failed allowed command: $allowed"
            }
          }

          $env:SSH_ORIGINAL_COMMAND = "python --version"
          $python = & $out 2>&1 | Out-String
          if ($LASTEXITCODE -notin @(0, 127) -or -not $python.Trim()) {
            throw "Restricted SSH console failed Python version probe"
          }

          foreach ($denied in @("status;whoami", "cmd", "powershell")) {
            $env:SSH_ORIGINAL_COMMAND = $denied
            $text = & $out 2>&1 | Out-String
            if ($LASTEXITCODE -ne 2 -or -not $text.Contains("DENIED:")) {
              throw "Restricted SSH console accepted unsafe command: $denied"
            }
          }
          Remove-Item Env:SSH_ORIGINAL_COMMAND -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0
          Write-Host "Restricted SSH console compile/allow-list: OK"

      - name: Validate restricted SSH bootstrap policy
        shell: pwsh
        run: |
          $path = (Resolve-Path -LiteralPath "agent\configure_restricted_ssh.ps1").Path
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $text = Get-Content -LiteralPath $path -Raw
          foreach ($required in @(
            'ListenAddress 127.0.0.1',
            'AllowUsers $SshUser',
            'AuthenticationMethods publickey',
            'PasswordAuthentication no',
            'AllowAgentForwarding no',
            'ForceCommand C:/ProgramData/CitadelEWS/ssh/CitadelSshConsole.exe',
            'AllowTcpForwarding no',
            'GatewayPorts no',
            'Windows OpenSSH did not generate sshd_config on first service start.',
            'Disable-NetFirewallRule',
            '& $SshdExe -t -f $SshdConfig',
            'Unsafe non-loopback SSH listener detected',
            'Resolve-AgentLayout',
            'flat_oneclick',
            'StateRoot',
            'backup_path',
            'Read-Host $Prompt -AsSecureString',
            '$Cloudflared service install $PlainTunnelToken',
            'cloudflared_service_created_by_citadel',
            'service uninstall',
            'Cloudflare.cloudflared',
            'Get-AuthenticodeSignature',
            'ProgramFilesX86'
          )) {
            if (-not $text.Contains($required)) { throw "Restricted SSH bootstrap invariant missing: $required" }
          }
          if ($text.Contains("-ExecutionPolicy Bypass")) { throw "Restricted SSH bootstrap must not bypass execution policy" }
          if ($text.Contains('[string]$CloudflareTunnelToken')) { throw "Tunnel token must not be accepted as a command-line parameter" }
          if ($text.Contains("tunnel_token =")) { throw "Tunnel token must not be persisted in bootstrap state" }
          if ($text.Contains("Get-Command cloudflared")) { throw "Elevated SSH bootstrap must not resolve cloudflared from PATH" }
          if ($text.Contains("Microsoft\\WinGet\\Links\\cloudflared.exe")) { throw "Elevated SSH bootstrap must not execute user-writable WinGet links" }
          if (-not $text.Contains('"RemoteSigned"')) { throw "Restricted SSH bootstrap elevation must use process-only RemoteSigned policy" }
          foreach ($unsupported in @("KbdInteractiveAuthentication", "PermitTunnel", "X11Forwarding")) {
            if ($text.Contains($unsupported)) { throw "Windows OpenSSH unsupported directive returned: $unsupported" }
          }
          Write-Host "Restricted SSH bootstrap policy: OK"

      - name: Compile Windows SCM service host
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"),
            (Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe")
          )
          $csc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $csc) { throw ".NET Framework csc.exe not found" }
          $out = Join-Path $env:RUNNER_TEMP "CitadelNodeService.exe"
          $source = (Resolve-Path -LiteralPath "agent\CitadelNodeService.cs").Path
          & $csc /nologo /optimize+ /target:winexe "/out:$out" /reference:System.ServiceProcess.dll $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $out --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Windows service host compile/self-test: OK"
      - name: Verify one-time legacy state migration on repair
        shell: pwsh
        run: ./tests/windows-repair-migration.ps1
      - name: Validate installer AST and real SCM configuration
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $setupPath = (Resolve-Path -LiteralPath "agent\setup_windows.ps1").Path
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($setupPath, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $commands = @($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.CommandAst]
          }, $true) | ForEach-Object { $_.GetCommandName() })
          foreach ($required in @(
            "Set-CitadelDirectoryAcl",
            "Set-CitadelServiceDefinition",
            "Set-CitadelServiceRecovery",
            "Start-Service",
            "Get-CimInstance",
            "Remove-CitadelServiceDefinition"
          )) {
            if ($commands -notcontains $required) { throw "Active installer command missing: $required" }
          }

          $installer = (Get-Content -LiteralPath "agent/Install Windows Node.cmd" -Raw).ToLowerInvariant()
          $setupLower = (Get-Content -LiteralPath $setupPath -Raw).ToLowerInvariant()
          if ($installer.Contains("executionpolicy bypass") -or $setupLower.Contains("executionpolicy bypass")) {
            throw "ExecutionPolicy Bypass is forbidden"
          }
          if ($setupLower.Contains("createshortcut(") -or $setupLower.Contains("pythonw.exe")) {
            throw "Legacy Startup lifecycle returned"
          }

          . (Resolve-Path -LiteralPath "agent\windows_service.ps1").Path
          $testName = "CitadelEwsCi" + ([Guid]::NewGuid().ToString("N").Substring(0, 8))
          $testDir = Join-Path $env:RUNNER_TEMP "Citadel Service Path Test"
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $mockExe = Join-Path $testDir "Mock Service.exe"
          Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32\cmd.exe") -Destination $mockExe -Force
          $imagePath = '"' + $mockExe + '" /c exit 0'
          try {
            $configured = Set-CitadelServiceDefinition -Name $testName -DisplayName "CITADEL CI SCM Test" -BinaryPathName $imagePath -StartName "NT AUTHORITY\LocalService" -DelayedAutoStart $true
            if ([string]$configured.PathName -ne $imagePath) { throw "SCM ImagePath round-trip failed" }
            if ([string]$configured.StartMode -ne "Auto") { throw "SCM StartMode round-trip failed" }
            if ([string]$configured.StartName -ne "NT AUTHORITY\LocalService") { throw "SCM account round-trip failed" }
            $reg = Get-ItemProperty -LiteralPath ("HKLM:\SYSTEM\CurrentControlSet\Services\" + $testName) -Name DelayedAutostart
            if ([int]$reg.DelayedAutostart -ne 1) { throw "SCM delayed-auto round-trip failed" }
          } finally {
            Remove-CitadelServiceDefinition -Name $testName
          }
          Write-Host "Windows installer AST + real SCM round-trip: OK"

  lmstudio-real-runtime:
    name: LM Studio real model inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    env:
      CITADEL_TEST_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt
      - name: Install official runtime, download and load a small model, request hi
        run: python tests/lmstudio-real-runtime.py

  gate:
    name: CI gate
    if: always()
    needs: [validate-linux, agent-package, windows-agent, ssh-terminal-browser, lmstudio-real-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        run: |
          test "${{ needs.validate-linux.result }}" = "success"
          test "${{ needs.agent-package.result }}" = "success"
          test "${{ needs.windows-agent.result }}" = "success"
          test "${{ needs.ssh-terminal-browser.result }}" = "success"
          test "${{ needs.lmstudio-real-runtime.result }}" = "success"
          echo "All CI gates passed."
