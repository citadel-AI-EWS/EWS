name: Deploy Cloudflare TEST

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Type DEPLOY_TEST to deploy the current main commit.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm_test_deploy == 'DEPLOY_TEST' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Node dependencies
        run: npm ci

      - name: Build immutable static site
        run: scripts/build_site.sh

      - name: Normalize optional OpenRouter quality-gate secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          let key = String(process.env.OPENROUTER_API_KEY || "").trim();
          if (/^OPENROUTER_API_KEY=/i.test(key)) key = key.replace(/^OPENROUTER_API_KEY=/i, "").trim();
          if (/^Bearer\s+/i.test(key)) key = key.replace(/^Bearer\s+/i, "").trim();
          if ((key.startsWith('"') && key.endsWith('"')) || (key.startsWith("'") && key.endsWith("'"))) {
            key = key.slice(1, -1).trim();
          }
          if (!/^sk-or-v1-[A-Za-z0-9_-]{20,}$/.test(key)) {
            const embedded = key.match(/sk-or-v1-[A-Za-z0-9_-]{20,}/);
            if (embedded) key = embedded[0];
          }
          if (!key) {
            fs.writeFileSync("/tmp/openrouter-key", "", { mode: 0o600 });
            process.exit(0);
          }
          if (!/^[\x21-\x7E]{16,512}$/.test(key)) {
            console.error("OPENROUTER_API_KEY remains invalid after trimming whitespace/quotes.");
            process.exit(2);
          }
          fs.writeFileSync("/tmp/openrouter-key", key, { mode: 0o600 });
          NODE

      - name: Sync optional OpenRouter quality-gate secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -s /tmp/openrouter-key ]; then
            echo "OPENROUTER_API_KEY is not configured; final quality gate will remain bypassed."
          else
            npx wrangler secret put OPENROUTER_API_KEY < /tmp/openrouter-key
          fi

      - name: Verify configured OpenRouter API key
        run: |
          if [ ! -s /tmp/openrouter-key ]; then
            echo "OPENROUTER_API_KEY is not configured; probe skipped."
          else
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          const key = fs.readFileSync("/tmp/openrouter-key", "utf8");
          const r = await fetch("https://openrouter.ai/api/v1/key", {
            headers: { authorization: "Bearer " + key }
          });
          if (!r.ok) {
            console.error("OpenRouter key probe returned HTTP " + r.status);
            process.exit(1);
          }
          console.log("OpenRouter key probe: authenticated");
          NODE
          fi

      - name: Sync optional D1 analytics token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ANALYTICS_TOKEN: ${{ secrets.D1_ANALYTICS_TOKEN }}
        run: |
          if [ -z "$D1_ANALYTICS_TOKEN" ]; then
            echo "D1_ANALYTICS_TOKEN is not configured; D1 percentage will show no data."
          else
            printf '%s' "$D1_ANALYTICS_TOKEN" | npx wrangler secret put D1_ANALYTICS_TOKEN
          fi

      - name: Sync optional Google Drive payload credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GOOGLE_DRIVE_CLIENT_ID" ] || [ -z "$GOOGLE_DRIVE_CLIENT_SECRET" ] || [ -z "$GOOGLE_DRIVE_REFRESH_TOKEN" ]; then
            echo "Google Drive payload credentials are not configured; payload writes will fail closed with drive_payload_storage_unavailable."
          else
            printf '%s' "$GOOGLE_DRIVE_CLIENT_ID" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_ID
            printf '%s' "$GOOGLE_DRIVE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_DRIVE_CLIENT_SECRET
            printf '%s' "$GOOGLE_DRIVE_REFRESH_TOKEN" | npx wrangler secret put GOOGLE_DRIVE_REFRESH_TOKEN
            echo "Google Drive payload credentials synced."
          fi

      - name: Sync optional direct SSH gateway configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SSH_GATEWAY_URL: ${{ secrets.SSH_GATEWAY_URL }}
          SSH_GATEWAY_TICKET_SECRET: ${{ secrets.SSH_GATEWAY_TICKET_SECRET }}
        run: |
          if [ -z "$SSH_GATEWAY_URL" ] && [ -z "$SSH_GATEWAY_TICKET_SECRET" ]; then
            printf '%s\n' '{"SSH_GATEWAY_URL":null,"SSH_GATEWAY_TICKET_SECRET":null}' | npx wrangler secret bulk
            echo "Direct SSH gateway is disabled; persisted gateway secrets were removed."
          elif [ -z "$SSH_GATEWAY_URL" ] || [ -z "$SSH_GATEWAY_TICKET_SECRET" ]; then
            echo "Both SSH gateway secrets are required."
            exit 1
          else
            node --input-type=module <<'NODE'
          let valid = false;
          try {
            const url = new URL(process.env.SSH_GATEWAY_URL);
            const secret = process.env.SSH_GATEWAY_TICKET_SECRET;
            valid = url.protocol === 'https:' && url.pathname === '/ssh' && !url.username && !url.password && !url.search && !url.hash &&
              secret.length >= 32 && secret.length <= 512 && !/\s/.test(secret);
          } catch {}
          if (!valid) { console.error('Invalid SSH gateway configuration'); process.exit(1); }
          NODE
            printf '%s' "$SSH_GATEWAY_URL" | npx wrangler secret put SSH_GATEWAY_URL
            printf '%s' "$SSH_GATEWAY_TICKET_SECRET" | npx wrangler secret put SSH_GATEWAY_TICKET_SECRET
          fi

      - name: Expand legacy TEST command schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'commands'" --json > /tmp/citadel-command-schema.json
          if node -e "const r=require('/tmp/citadel-command-schema.json'); process.exit(/CHECK\\s*\\(\\s*command_type/i.test(r[0]?.results?.[0]?.sql || '') ? 0 : 1)"; then
            npx wrangler d1 execute citadel-control --remote --command "SELECT (SELECT COUNT(*) FROM commands) AS commands_count, (SELECT COUNT(*) FROM ssh_console_results) AS ssh_results_count" --json > /tmp/citadel-command-counts-before.json
            npx wrangler d1 execute citadel-control --remote --yes --file migrations/0028_expand_legacy_commands.sql
            npx wrangler d1 execute citadel-control --remote --command "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'commands'" --json > /tmp/citadel-command-schema-after.json
            npx wrangler d1 execute citadel-control --remote --command "SELECT (SELECT COUNT(*) FROM commands) AS commands_count, (SELECT COUNT(*) FROM ssh_console_results) AS ssh_results_count" --json > /tmp/citadel-command-counts-after.json
            node -e "const fs=require('node:fs'); const before=require('/tmp/citadel-command-counts-before.json')[0].results[0]; const after=require('/tmp/citadel-command-counts-after.json')[0].results[0]; const schema=require('/tmp/citadel-command-schema-after.json')[0].results[0].sql; if (JSON.stringify(before)!==JSON.stringify(after) || /CHECK\\s*\\(\\s*command_type/i.test(schema)) process.exit(1); console.log('Legacy commands migrated; command and SSH result counts preserved:',after)"
          else
            echo "Command table already accepts current command types."
          fi

      - name: Deploy TEST site and Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            ARCHITECT_TOKEN_HASH
            CONTROLLER_COMMAND_PRIVATE_JWK
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}

      - name: Verify deployed TEST against real endpoints
        env:
          CITADEL_BASE_URL: https://citadel-ai.init1.workers.dev
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_MS: "3000"
        run: node scripts/smoke_test.mjs "$CITADEL_BASE_URL"

      - name: Deployment summary
        if: success()
        run: |
          echo "### CITADEL Cloudflare TEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI gate: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare deploy: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
