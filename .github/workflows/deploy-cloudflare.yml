name: Deploy Cloudflare TEST

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Type DEPLOY_TEST to deploy the current main commit.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.confirm_test_deploy == 'DEPLOY_TEST' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact CI-approved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Node dependencies
        run: npm ci

      - name: Build immutable static site
        run: scripts/build_site.sh

      - name: Sync optional OpenRouter quality-gate secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
          else
            echo "OPENROUTER_API_KEY is not configured; final quality gate will remain bypassed."
          fi

      - name: Verify configured OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY is not configured; probe skipped."
          else
            node -e 'const r=await fetch("https://openrouter.ai/api/v1/key",{headers:{authorization:"Bearer "+process.env.OPENROUTER_API_KEY}});if(!r.ok){console.error("OpenRouter key probe failed with HTTP "+r.status);process.exit(1)}const d=await r.json();console.log("OpenRouter key probe: authenticated");console.log("OpenRouter key limit configured: "+(d?.data?.limit!=null?"yes":"no"));'
          fi

      - name: Deploy TEST site and Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            ARCHITECT_TOKEN_HASH
            CONTROLLER_COMMAND_PRIVATE_JWK
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}

      - name: Verify deployed TEST against real endpoints
        env:
          CITADEL_BASE_URL: https://citadel-ai.init1.workers.dev
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_MS: "3000"
        run: node scripts/smoke_test.mjs "$CITADEL_BASE_URL"

      - name: Deployment summary
        if: success()
        run: |
          echo "### CITADEL Cloudflare TEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$DEPLOY_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI gate: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloudflare deploy: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live smoke test: passed" >> "$GITHUB_STEP_SUMMARY"
