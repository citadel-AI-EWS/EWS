name: Deploy Cloudflare TEST

on:
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Type DEPLOY_TEST; this site is not approved for customer production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_test_deploy == 'DEPLOY_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: python -m pip install --requirement requirements-dev.txt
      - run: scripts/validate.sh
      - run: scripts/build_site.sh
      - name: Deploy TEST site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
