name: Deploy Cloudflare TEST

on:
  push:
    branches: [main, "work/storage-tiering-r2-v1"]
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Type DEPLOY_TEST; this site is not approved for customer production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_test_deploy == 'DEPLOY_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: python -m pip install --requirement requirements-dev.txt
      - run: scripts/validate.sh
      - run: scripts/build_site.sh
      - name: Deploy TEST site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            ARCHITECT_TOKEN_HASH
            CONTROLLER_COMMAND_PRIVATE_JWK
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
      - name: Verify TEST controls
        run: |
          for attempt in $(seq 1 20); do
            response="$(curl --fail --silent --show-error "https://citadel-ai.init1.workers.dev/api/health?deployment=${GITHUB_SHA}-${attempt}")"
            if node -e 'const value = JSON.parse(process.argv[1]); process.exit(value.ok && value.controller_signing === "ready" && value.report_storage === "ready" && value.session_storage === "ready" && value.telemetry_storage === "ready" && value.report_tiering_schema === "ready" && value.report_storage_provider === "gdrive" && ["ready", "not_configured"].includes(value.report_google_drive) ? 0 : 1)' "$response"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
