name: Deploy Cloudflare TEST

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_test_deploy:
        description: Type DEPLOY_TEST; this site is not approved for customer production.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_test_deploy == 'DEPLOY_TEST'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install --requirement requirements-dev.txt
      - run: scripts/validate.sh
      - run: scripts/build_site.sh
      - name: Deploy TEST site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          secrets: |
            ARCHITECT_TOKEN_HASH
            CONTROLLER_COMMAND_PRIVATE_JWK
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
      - name: Verify TEST controls
        run: |
          for attempt in $(seq 1 20); do
            health="$(curl --fail --silent --show-error "https://citadel-ai.init1.workers.dev/api/health?deployment=${GITHUB_SHA}-${attempt}")" || true
            hub="$(curl --fail --silent --show-error "https://citadel-ai.init1.workers.dev/api/v1/hub/nodes?deployment=${GITHUB_SHA}-${attempt}")" || true
            root="$(curl --fail --silent --show-error "https://citadel-ai.init1.workers.dev/?deployment=${GITHUB_SHA}-${attempt}")" || true
            if node -e '
              const health = JSON.parse(process.argv[1]);
              const hub = JSON.parse(process.argv[2]);
              const root = process.argv[3];
              const ready = health.ok &&
                health.controller_signing === "ready" &&
                health.report_storage === "ready" &&
                health.session_storage === "ready" &&
                health.telemetry_storage === "ready" &&
                health.presence_storage === "ready" &&
                hub.ok === true && Array.isArray(hub.nodes) &&
                root.includes("נתונים אמיתיים בלבד") &&
                !root.includes("ews-demo-has-project");
              process.exit(ready ? 0 : 1);
            ' "$health" "$hub" "$root"; then
              exit 0
            fi
            sleep 3
          done
          exit 1
