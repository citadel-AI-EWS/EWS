name: Diagnose a18 bridge update
on:
  push:
    branches: [diagnose/a18-bridge-update]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read bounded a18 update events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --json --command "SELECT nl.created_at, nl.event_type, json_extract(nl.details_json, '$.command_id') AS command_id, substr(json_extract(nl.details_json, '$.error'), 1, 240) AS error FROM node_logs AS nl JOIN nodes AS n ON n.node_id = nl.node_id WHERE n.hostname = 'a18' AND nl.event_type IN ('command_failed', 'agent_update_rolled_back', 'agent_update_healthcheck_passed', 'agent_updated') AND datetime(nl.created_at) >= datetime('now', '-8 hours') ORDER BY datetime(nl.created_at) DESC LIMIT 24" > /tmp/a18-update-events.json
          node <<'NODE'
          const fs = require('node:fs');
          const batches = JSON.parse(fs.readFileSync('/tmp/a18-update-events.json', 'utf8'));
          const rows = batches.flatMap(batch => batch.results || []);
          console.log('a18 update events: ' + rows.length);
          for (const row of rows) {
            const error = String(row.error || '')
              .replace(/Bearer\s+[^\s]+/gi, '[redacted]')
              .replace(/[A-Za-z0-9_+/-]{60,}/g, '[redacted]');
            console.log(JSON.stringify({
              created_at: row.created_at,
              event_type: row.event_type,
              command_id: row.command_id,
              error
            }));
          }
          NODE
