name: Reset Architect Access

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET_ARCHITECT_ACCESS to confirm the verifier reset.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: architect-access-reset
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirm == 'RESET_ARCHITECT_ACCESS'
    runs-on: ubuntu-latest
    environment: cloudflare-test
    timeout-minutes: 10
    env:
      CITADEL_BASE_URL: https://citadel-ai.init1.workers.dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned Node dependencies
        run: npm ci

      - name: Validate protected Architect verifier
        shell: bash
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
        run: |
          if [[ ! "$ARCHITECT_TOKEN_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ARCHITECT_TOKEN_HASH must be a lowercase SHA-256 hex value."
            exit 1
          fi

      - name: Sync Architect verifier into Worker secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
        run: |
          set -euo pipefail
          printf '%s' "$ARCHITECT_TOKEN_HASH" | npx wrangler secret put ARCHITECT_TOKEN_HASH

      - name: Reset Architect verifier through Worker D1 binding
        shell: bash
        env:
          ARCHITECT_TOKEN_HASH: ${{ secrets.ARCHITECT_TOKEN_HASH }}
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent --show-error               -X POST "$CITADEL_BASE_URL/api/v1/architect/security/sync-bootstrap-reset"               -H "content-type: application/json"               -H "x-citadel-bootstrap-hash: $ARCHITECT_TOKEN_HASH"               --data '{"confirm":"RESET_ARCHITECT_ACCESS"}'               --output "$RUNNER_TEMP/architect-reset-response.json"; then
              node -e '
                const fs=require("fs");
                const p=process.env.RUNNER_TEMP+"/architect-reset-response.json";
                const d=JSON.parse(fs.readFileSync(p,"utf8"));
                if(!d.ok || !d.architect_verifier_synced) process.exit(1);
              '
              exit 0
            fi
            sleep 3
          done
          echo "Architect reset endpoint did not accept the synchronized Worker secret."
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "### Architect access reset" >> "$GITHUB_STEP_SUMMARY"
          echo "- Protected GitHub environment: cloudflare-test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker secret: synchronized" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 verifier: updated through the Worker's D1 binding" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct D1 API permission: not required" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing nodes, projects, missions, reports, and model data: unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous Architect token and recovery code: invalidated" >> "$GITHUB_STEP_SUMMARY"
