name: Apply verified security hardening

on:
  push:
    branches:
      - release/security-hardening-20260919

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/security-hardening-20260919
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git am ews-security-hardening.patch
          rm ews-security-hardening.patch .github/workflows/apply-security-hardening.yml
          git add -A
          git commit -m "Remove one-time release helper"
          git push origin HEAD:release/security-hardening-20260919
