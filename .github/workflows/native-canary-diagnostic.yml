name: Bounded native canary console
on:
  workflow_dispatch:
  push:
    branches: [main, fix/live-update-diagnostic-20261009]
    paths:
      - scripts/native_canary_diagnostic.mjs
      - .github/workflows/native-canary-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read failed canary logs through signed restricted console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
        run: node scripts/native_canary_diagnostic.mjs

