name: Bounded native canary console
on:
  workflow_dispatch:
  push:
    branches: [main, fix/live-update-diagnostic-20261009]
    paths:
      - scripts/native_canary_diagnostic.mjs
      - .github/workflows/native-canary-diagnostic.yml
permissions:
  contents: read
jobs:
  windows-staging:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r agent/requirements.txt
      - name: Staged self-test under inherited Windows service environment
        run: python tests/staged-self-test.py
      - name: Staged self-test as LocalSystem
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\staged-self-test.py'
          $log = Join-Path $env:RUNNER_TEMP 'citadel-system-self-test.log'
          $taskName = 'CitadelStagedSelfTest-' + [guid]::NewGuid().ToString('N')
          $arguments = '/d /s /c ""' + $python + '" "' + $script + '" > "' + $log + '" 2>&1"'
          $action = New-ScheduledTaskAction -Execute $env:ComSpec -Argument $arguments
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal | Out-Null
          try {
            Start-ScheduledTask -TaskName $taskName
            $deadline = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep -Seconds 2
              $state = (Get-ScheduledTask -TaskName $taskName).State
              $info = Get-ScheduledTaskInfo -TaskName $taskName
            } while (($state -eq 'Running' -or $info.LastRunTime.Year -lt 2026) -and (Get-Date) -lt $deadline)
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            if ($state -eq 'Running' -or $info.LastTaskResult -ne 0) { throw 'LocalSystem staged self-test failed' }
          } finally {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false
          }
  diagnostic:
    needs: windows-staging
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read failed canary logs through signed restricted console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
        run: node scripts/native_canary_diagnostic.mjs

