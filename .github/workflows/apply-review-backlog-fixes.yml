name: Apply review backlog fixes

on:
  push:
    branches:
      - fix/review-backlog-20260917

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: npm ci
      - run: python -m pip install --requirement requirements-dev.txt
      - name: Make helper replacements literal
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply_review_backlog_fixes.py")
          text = path.read_text(encoding="utf-8")
          old = 'new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit("regex helper pattern missing")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY
      - name: Apply targeted fixes
        run: python scripts/apply_review_backlog_fixes.py
      - name: Validate repository
        run: scripts/validate.sh
      - name: Validate fixed agent package
        run: python scripts/build_fixed_agent_package.py
      - name: Commit validated source fixes
        shell: bash
        run: |
          rm -rf dist
          rm -f scripts/apply_review_backlog_fixes.py .github/workflows/apply-review-backlog-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix enrollment, telemetry and Windows agent review backlog"
          git push origin HEAD:fix/review-backlog-20260917
