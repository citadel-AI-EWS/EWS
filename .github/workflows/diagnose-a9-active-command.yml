name: Diagnose a9 active command

on:
  push:
    branches:
      - diag/a9-active-command-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read active commands for a9
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT command_id,node_id,command_type,status,created_at,completed_at FROM commands WHERE node_id='a9' AND status IN ('pending','accepted') ORDER BY datetime(created_at) DESC LIMIT 20;"
      - name: Read a9 AI runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT node_id,state_json,updated_at FROM node_ai_runtime_state WHERE node_id='a9';"
