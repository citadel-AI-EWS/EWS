name: Diagnose a9 active command

on:
  push:
    branches:
      - diag/a9-active-command-20261005

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Resolve a9 node identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT node_id,hostname,status,agent_version,last_seen_at FROM nodes WHERE hostname='a9' OR node_id='a9' OR node_id IN (SELECT node_id FROM node_network_state WHERE lan_ipv4='192.168.1.122');"
      - name: Read active commands for resolved a9
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT c.command_id,c.node_id,n.hostname,c.command_type,c.status,c.created_at,c.completed_at FROM commands c LEFT JOIN nodes n ON n.node_id=c.node_id WHERE (n.hostname='a9' OR c.node_id='a9' OR c.node_id IN (SELECT node_id FROM node_network_state WHERE lan_ipv4='192.168.1.122')) AND c.status IN ('pending','accepted') ORDER BY datetime(c.created_at) DESC LIMIT 20;"
      - name: Read AI runtime for resolved a9
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT r.node_id,n.hostname,r.state_json,r.updated_at FROM node_ai_runtime_state r LEFT JOIN nodes n ON n.node_id=r.node_id WHERE n.hostname='a9' OR r.node_id='a9' OR r.node_id IN (SELECT node_id FROM node_network_state WHERE lan_ipv4='192.168.1.122');"
      - name: Find online wake relays on a9 LAN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute citadel-control --remote --command "SELECT n.node_id,n.hostname,n.status,n.agent_version,n.last_seen_at,net.lan_ipv4 FROM nodes n JOIN node_network_state net ON net.node_id=n.node_id WHERE n.node_id!='node_26a9e554-564f-4ce8-9026-2d3cef22dab0' AND net.lan_ipv4 LIKE '192.168.1.%' ORDER BY datetime(n.last_seen_at) DESC LIMIT 50;"
