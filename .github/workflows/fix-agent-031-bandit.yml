name: Fix Agent 0.3.1 Bandit marker

on:
  push:
    branches: [feature/promote-agent-0.3.1]
    paths:
      - scripts/fix_agent_031_bandit.py
      - .github/workflows/fix-agent-031-bandit.yml

permissions:
  contents: write

concurrency:
  group: fix-agent-031-bandit
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/promote-agent-0.3.1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply safe identifier rename and re-pin hashes
        run: python scripts/fix_agent_031_bandit.py
      - name: Commit product-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Fix Bandit false positive and re-pin Agent 0.3.1"
          git push origin HEAD:feature/promote-agent-0.3.1
