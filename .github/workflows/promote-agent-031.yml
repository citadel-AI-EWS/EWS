name: Promote verified agent 0.3.1 source

on:
  push:
    branches: [feature/promote-agent-0.3.1]
    paths:
      - scripts/promote_agent_031.py
      - .github/workflows/promote-agent-031.yml

permissions:
  contents: write

concurrency:
  group: promote-agent-031
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v7
        with:
          ref: feature/promote-agent-0.3.1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Promote exact CI-verified source
        run: python scripts/promote_agent_031.py
      - name: Commit promoted source
        run: |
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Promote verified agent 0.3.1 to repository source"
          git push origin HEAD:feature/promote-agent-0.3.1
