name: Temporary remote update guard

on:
  push:
    branches:
      - feature/remote-update-guard-20260917

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply guarded updater patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # Agent core: signed restart/rollback, post-install startup check, release 0.3.2.
          path = "agent/citadel_node_v1.py"
          text = read(path)
          text = must_replace(text, 'VERSION = "0.3.1"', 'VERSION = "0.3.2"', "v1 version")
          text = must_replace(
              text,
              'SUPPORTED_COMMANDS = {"pause", "resume", "update", "uninstall"}',
              'SUPPORTED_COMMANDS = {"pause", "resume", "update", "restart", "rollback", "uninstall"}',
              "agent command allowlist",
          )
          text = must_replace(
              text,
              '                os.replace(staging / name, current)\n                replaced.append(name)\n            self.log.write("agent_updated", version=payload["version"], files=replaced)',
              '''                os.replace(staging / name, current)\n                replaced.append(name)\n            if "citadel_node_v2.py" in replaced:\n                installed_entrypoint = install_root / "citadel_node_v2.py"\n                result = subprocess.run(  # nosec B603\n                    [\n                        sys.executable,\n                        str(installed_entrypoint),\n                        "startup-check",\n                        "--config",\n                        str(self.config_path),\n                    ],\n                    cwd=install_root,\n                    timeout=120,\n                    capture_output=True,\n                    text=True,\n                    shell=False,\n                )\n                if result.returncode != 0:\n                    raise RuntimeError("updated agent startup health-check failed")\n                self.log.write(\n                    "agent_update_healthcheck_passed",\n                    version=payload["version"],\n                    files=replaced,\n                )\n            self.log.write("agent_updated", version=payload["version"], files=replaced)''',
              "post-install startup check",
          )
          rollback_method = '''\n    def rollback_last_update(self) -> None:\n        install_root = Path(__file__).resolve().parent\n        backup = self.config.data_dir / "update-backup"\n        missing = [name for name in UPDATE_FILE_NAMES if not (backup / name).is_file()]\n        if missing:\n            raise RuntimeError("complete update backup unavailable")\n        staging = Path(tempfile.mkdtemp(prefix="citadel-rollback-", dir=self.config.data_dir))\n        try:\n            for name in sorted(UPDATE_FILE_NAMES):\n                shutil.copy2(backup / name, staging / name)\n            entrypoint = staging / "citadel_node_v2.py"\n            result = subprocess.run(  # nosec B603\n                [sys.executable, str(entrypoint), "self-test"],\n                cwd=staging,\n                timeout=120,\n                capture_output=True,\n                text=True,\n                shell=False,\n            )\n            if result.returncode != 0:\n                raise RuntimeError("rollback backup self-test failed")\n            for name in sorted(UPDATE_FILE_NAMES):\n                shutil.copy2(staging / name, install_root / name)\n            self.log.write(\n                "agent_update_manual_rollback",\n                files=sorted(UPDATE_FILE_NAMES),\n            )\n        finally:\n            shutil.rmtree(staging, ignore_errors=True)\n\n'''
          text = must_replace(
              text,
              '        finally:\n            shutil.rmtree(staging, ignore_errors=True)\n\n    def ack_command',
              '        finally:\n            shutil.rmtree(staging, ignore_errors=True)\n' + rollback_method + '    def ack_command',
              "manual rollback method",
          )
          text = must_replace(
              text,
              '''                elif command_type == "update":\n                    self.apply_update(command.get("payload") or {})\n                    restart_after = True\n                elif command_type == "uninstall":''',
              '''                elif command_type == "update":\n                    self.apply_update(command.get("payload") or {})\n                    restart_after = True\n                elif command_type == "restart":\n                    self.log.write("agent_restart_requested")\n                    restart_after = True\n                elif command_type == "rollback":\n                    self.rollback_last_update()\n                    restart_after = True\n                elif command_type == "uninstall":''',
              "restart and rollback commands",
          )
          write(path, text)

          # Agent v2: startup-check mode and telemetry for updater lifecycle.
          path = "agent/citadel_node_v2.py"
          text = read(path)
          text = must_replace(text, 'VERSION = "0.3.1"', 'VERSION = "0.3.2"', "v2 version")
          text = must_replace(
              text,
              '    "agent_update_rolled_back",\n    "command_failure_ack_failed",',
              '    "agent_update_rolled_back",\n    "agent_update_healthcheck_passed",\n    "agent_update_manual_rollback",\n    "agent_restart_requested",\n    "command_failure_ack_failed",',
              "telemetry updater events",
          )
          startup_check = '''\n\ndef startup_check(config_path: Path) -> int:\n    """Validate the installed release in a fresh process before daemon handoff."""\n    if self_test() != 0:\n        return 2\n    config = v1.AgentConfig.from_file(config_path)\n    agent = Agent(config, config_path)\n    agent.identity.require_key()\n    if not config.data_dir.exists():\n        raise RuntimeError("agent data directory is unavailable")\n    agent.log.write(\n        "agent_update_healthcheck_passed",\n        version=VERSION,\n        phase="fresh_process_startup",\n    )\n    print(f"CITADEL startup health-check {VERSION}: PASS")\n    return 0\n'''
          text = must_replace(
              text,
              '\n\ndef parse_args(argv: list[str] | None = None) -> argparse.Namespace:',
              startup_check + '\n\ndef parse_args(argv: list[str] | None = None) -> argparse.Namespace:',
              "startup check function",
          )
          text = must_replace(
              text,
              'choices=["doctor", "enroll", "once", "run", "self-test"],',
              'choices=["doctor", "enroll", "once", "run", "self-test", "startup-check"],',
              "startup check cli",
          )
          text = must_replace(
              text,
              '    if args.command == "self-test":\n        return self_test()\n    config = v1.AgentConfig.from_file(Path(args.config))',
              '    if args.command == "self-test":\n        return self_test()\n    if args.command == "startup-check":\n        return startup_check(Path(args.config))\n    config = v1.AgentConfig.from_file(Path(args.config))',
              "startup check dispatch",
          )
          write(path, text)

          v1_hash = hashlib.sha256(Path("agent/citadel_node_v1.py").read_bytes()).hexdigest()
          v2_hash = hashlib.sha256(Path("agent/citadel_node_v2.py").read_bytes()).hexdigest()

          # Installer pins and version marker.
          path = "agent/setup_windows.ps1"
          text = read(path)
          text = re.sub(r'\$ExpectedV1Sha256 = "[0-9a-f]{64}"', f'$ExpectedV1Sha256 = "{v1_hash}"', text, count=1)
          text = re.sub(r'\$ExpectedV2Sha256 = "[0-9a-f]{64}"', f'$ExpectedV2Sha256 = "{v2_hash}"', text, count=1)
          text = text.replace('agent_version = "0.3.1"', 'agent_version = "0.3.2"')
          write(path, text)

          # Signed Controller release and command allowlist.
          path = "src/index.js"
          text = read(path)
          text = must_replace(
              text,
              'const ALLOWED_ARCHITECT_COMMAND_TYPES = new Set(["pause", "resume", "update", "uninstall"]);',
              'const ALLOWED_ARCHITECT_COMMAND_TYPES = new Set(["pause", "resume", "update", "restart", "rollback", "uninstall"]);',
              "controller command allowlist",
          )
          text = must_replace(text, '  version: "0.3.1",', '  version: "0.3.2",', "release version")
          text = re.sub(
              r'(path: "citadel_node_v1\.py",\n\s+url: "[^"]+",\n\s+sha256: ")[0-9a-f]{64}("\n)',
              rf'\g<1>{v1_hash}\2', text, count=1,
          )
          text = re.sub(
              r'(path: "citadel_node_v2\.py",\n\s+url: "[^"]+",\n\s+sha256: ")[0-9a-f]{64}("\n)',
              rf'\g<1>{v2_hash}\2', text, count=1,
          )
          write(path, text)

          # Hub: expose only the new bounded signed commands.
          path = "hub.html"
          text = read(path)
          old = '      if(node.status==="paused")add(lang==="he"?"המשך":lang==="en"?"Resume":"Продолжить","",()=>sendCommand(node.node_id,"resume"),pending);else add(lang==="he"?"השהה":lang==="en"?"Pause":"Пауза","warn",()=>sendCommand(node.node_id,"pause"),pending||node.status==="revoked");\n      if(presence?.public_ip)'
          new = '      if(node.status==="paused")add(lang==="he"?"המשך":lang==="en"?"Resume":"Продолжить","",()=>sendCommand(node.node_id,"resume"),pending);else add(lang==="he"?"השהה":lang==="en"?"Pause":"Пауза","warn",()=>sendCommand(node.node_id,"pause"),pending||node.status==="revoked");\n      add(lang==="he"?"הפעל מחדש":lang==="en"?"Restart":"Перезапустить","warn",()=>sendCommand(node.node_id,"restart"),pending||node.status==="revoked");\n      add(lang==="he"?"חזרה לגרסה קודמת":lang==="en"?"Rollback":"Откатить","danger",()=>sendCommand(node.node_id,"rollback"),pending||node.status==="revoked");\n      if(presence?.public_ip)'
          text = must_replace(text, old, new, "hub restart rollback buttons")
          text = must_replace(
              text,
              'const labels={update:"update",pause:"pause",resume:"resume",uninstall:"disconnect"};',
              'const labels={update:"update",pause:"pause",resume:"resume",restart:"restart",rollback:"rollback",uninstall:"disconnect"};',
              "hub command labels",
          )
          write(path, text)

          # Architect console: same bounded controls and clearer update guarantee.
          path = "architect.html"
          text = read(path)
          text = must_replace(
              text,
              '          <button id="updateButton" class="secondary full" type="button">Обновить агент дистанционно</button>\n          <button id="disconnectButton"',
              '          <button id="updateButton" class="secondary full" type="button">Обновить агент дистанционно</button>\n          <button id="restartButton" class="secondary" type="button">Перезапустить агент</button>\n          <button id="rollbackButton" class="danger" type="button">Откатить последнее обновление</button>\n          <button id="disconnectButton"',
              "architect control buttons",
          )
          text = must_replace(
              text,
              '        <p class="small">Каждая команда подписывается Controller. Обновление проверяется по подписи и SHA‑256; при ошибке агент откатывает файлы.</p>',
              '        <p class="small">Каждая команда подписывается Controller. Обновление проверяется по подписи, SHA‑256, self-test и fresh-process startup-check; при ошибке файлы автоматически откатываются. Доступен и ручной откат последней сохранённой версии.</p>',
              "architect update explanation",
          )
          text = must_replace(
              text,
              '    const updateButton = document.getElementById("updateButton");\n    const disconnectButton',
              '    const updateButton = document.getElementById("updateButton");\n    const restartButton = document.getElementById("restartButton");\n    const rollbackButton = document.getElementById("rollbackButton");\n    const disconnectButton',
              "architect button bindings",
          )
          text = must_replace(
              text,
              '      updateButton.disabled = !node || pending || node.status === "revoked";\n      disconnectButton.disabled',
              '      updateButton.disabled = !node || pending || node.status === "revoked";\n      restartButton.disabled = !node || pending || node.status === "revoked";\n      rollbackButton.disabled = !node || pending || node.status === "revoked";\n      disconnectButton.disabled',
              "architect button states",
          )
          text = must_replace(
              text,
              'const labels = { pause: "Пауза", resume: "Возобновление", update: "Обновление", uninstall: "Отключение" };',
              'const labels = { pause: "Пауза", resume: "Возобновление", update: "Обновление", restart: "Перезапуск", rollback: "Откат", uninstall: "Отключение" };',
              "architect command feed labels",
          )
          text = must_replace(
              text,
              'const labels = { pause: "паузу", resume: "возобновление", update: "обновление", uninstall: "отключение" };\n      for (const button of [pauseButton, resumeButton, updateButton, disconnectButton])',
              'const labels = { pause: "паузу", resume: "возобновление", update: "обновление", restart: "перезапуск", rollback: "откат", uninstall: "отключение" };\n      for (const button of [pauseButton, resumeButton, updateButton, restartButton, rollbackButton, disconnectButton])',
              "architect send labels",
          )
          text = must_replace(
              text,
              '    updateButton.addEventListener("click", () => sendControl("update"));\n    disconnectButton.addEventListener',
              '    updateButton.addEventListener("click", () => sendControl("update"));\n    restartButton.addEventListener("click", () => sendControl("restart"));\n    rollbackButton.addEventListener("click", () => {\n      const node = currentNodes.find((item) => item.node_id === controlNodeSelect.value);\n      if (node && confirm(`Откатить агент ${node.hostname} к последней сохранённой версии?`)) sendControl("rollback");\n    });\n    disconnectButton.addEventListener',
              "architect listeners",
          )
          write(path, text)

          # Package builder follows the promoted release.
          path = "scripts/build_fixed_agent_package.py"
          text = read(path).replace("0.3.1", "0.3.2")
          write(path, text)

          # Durable project note.
          note = '''\n\n## 2026-09-17 — Remote update guard 0.3.2\n\n- Hub and Architect console can issue signed allowlisted `update`, `restart`, and `rollback` commands.\n- Remote update still accepts only official `raw.githubusercontent.com/citadel-AI-EWS/EWS/.../agent/` files with pinned SHA-256 hashes.\n- After replacing files, the agent launches the newly installed v2 in a fresh `startup-check` process using the real local config. Failure triggers automatic file rollback before daemon handoff.\n- Manual rollback validates the complete local backup with self-test before restoring it.\n- No arbitrary shell/command execution was introduced.\n'''
          memory = Path("docs/PROJECT_MEMORY.md")
          memory.write_text(memory.read_text(encoding="utf-8") + note, encoding="utf-8", newline="\n")

          # The temporary workflow removes itself in the same product commit.
          Path(".github/workflows/temporary-remote-update-guard.yml").unlink()
          print("patched agent release 0.3.2")
          print("v1", v1_hash)
          print("v2", v2_hash)
          PY
      - name: Verify release
        shell: bash
        run: |
          python -m pip install -r agent/requirements.txt
          python -m py_compile agent/citadel_node_v1.py agent/citadel_node_v2.py
          python agent/citadel_node_v1.py self-test
          python agent/citadel_node_v2.py self-test
          node tests/update-integrity.mjs
          git diff --check
      - name: Commit guarded release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden remote updates with startup check and rollback"
          git push origin HEAD:feature/remote-update-guard-20260917
