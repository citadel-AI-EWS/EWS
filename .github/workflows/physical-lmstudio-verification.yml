name: Bounded physical LM Studio verification
on:
  workflow_dispatch:
  push:
    branches: [fix/physical-lmstudio-verification-20261009]
    paths:
      - scripts/physical_lmstudio_verification.mjs
      - scripts/physical_status_observation.mjs
      - scripts/physical_failure_diagnostic.mjs
      - .github/workflows/physical-lmstudio-verification.yml
permissions:
  contents: read
jobs:
  physical-pilot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check scripts/physical_lmstudio_verification.mjs
      - name: Verify one updated physical node through signed fixed commands
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
        run: node scripts/physical_lmstudio_verification.mjs
  observation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check scripts/physical_status_observation.mjs
      - name: Observe aggregate physical fleet and pilot state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/physical_status_observation.mjs
  failure-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cloudflare-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --check scripts/physical_failure_diagnostic.mjs
      - name: Read bounded failure reasons without raw logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROLLER_COMMAND_PRIVATE_JWK: ${{ secrets.CONTROLLER_COMMAND_PRIVATE_JWK }}
        run: node scripts/physical_failure_diagnostic.mjs
