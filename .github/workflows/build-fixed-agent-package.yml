name: Build verified agent packages

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/build_fixed_agent_package.py"
      - "scripts/build_fixed_linux_agent_package.py"
      - ".github/workflows/build-fixed-agent-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt

      - name: Verify Windows x86 dependency wheels exist
        run: >-
          python -m pip download --disable-pip-version-check --only-binary=:all:
          --platform win32 --python-version 313 --implementation cp
          --abi cp313 --abi abi3
          --requirement agent/requirements-win32.txt
          --dest .tmp-win32-wheels

      - name: Build self-contained package
        run: python scripts/build_fixed_agent_package.py

      - name: Verify package contents and hashes
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_FIXED_AGENT_*' | head -n 1)"
          package_zip="${package_dir}.zip"
          test -n "$package_dir"
          test -f "$package_zip"
          python -m py_compile "$package_dir/citadel_node_v1.py" "$package_dir/citadel_node_v2.py"
          python "$package_dir/citadel_node_v2.py" self-test
          python - "$package_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "requirements-win32.txt", "setup_windows.ps1", "Install Windows Node.cmd", "START_HERE.cmd",
              "README_RU.txt", "VERIFY_PACKAGE.ps1"
          }
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          assert required <= seen, sorted(required - seen)
          installer = (root / "Install Windows Node.cmd").read_text(encoding="utf-8").lower()
          setup = (root / "setup_windows.ps1").read_text(encoding="utf-8").lower()
          assert "executionpolicy bypass" not in installer
          assert "executionpolicy bypass" not in setup
          assert "invoke-webrequest" not in setup
          print("Package manifest, offline source and installer policy: OK")
          PY
          unzip -t "$package_zip"

      - name: Build Linux package
        run: python scripts/build_fixed_linux_agent_package.py

      - name: Verify Linux package
        shell: bash
        run: |
          set -euo pipefail
          linux_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_LINUX_AGENT_*' | head -n 1)"
          linux_tar="${linux_dir}.tar.gz"
          test -n "$linux_dir"
          test -f "$linux_tar"
          bash -n "$linux_dir/setup_linux.sh" "$linux_dir/Install Linux Node.sh" "$linux_dir/START_HERE.sh"
          python -m py_compile "$linux_dir/citadel_node_v1.py" "$linux_dir/citadel_node_v2.py"
          python "$linux_dir/citadel_node_v2.py" self-test
          python - "$linux_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "windows_enterprise_probe.ps1", "requirements.txt",
              "setup_linux.sh", "Install Linux Node.sh", "START_HERE.sh",
              "README_LINUX.md"
          }
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          assert required <= seen, sorted(required - seen)
          setup = (root / "setup_linux.sh").read_text(encoding="utf-8").lower()
          assert "curl |" not in setup
          assert "wget |" not in setup
          assert "eval " not in setup
          print("Linux package manifest and installer policy: OK")
          PY
          tar -tzf "$linux_tar" >/dev/null

      - name: Publish verified Windows package in repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          package_zip="$(find dist -mindepth 1 -maxdepth 1 -type f -name 'CITADEL_FIXED_AGENT_*.zip' | head -n 1)"
          test -n "$package_zip"
          test -f "$package_zip"
          mkdir -p releases
          package_name="$(basename "$package_zip")"
          cp "$package_zip" "releases/$package_name"
          sha256sum "releases/$package_name" > "releases/$package_name.sha256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "releases/$package_name" "releases/$package_name.sha256"
          if git diff --cached --quiet; then
            echo "Verified Windows package is already published."
            exit 0
          fi
          git commit -m "release(agent): publish $package_name"
          git push origin HEAD:main

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CITADEL-Windows-Agent-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified Linux package
        uses: actions/upload-artifact@v4
        with:
          name: CITADEL-Linux-Agent-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
