name: Build verified Windows agent package

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/build_fixed_agent_package.py"
      - ".github/workflows/build-fixed-agent-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: python -m pip install --disable-pip-version-check --requirement agent/requirements.txt

      - name: Build self-contained package
        run: python scripts/build_fixed_agent_package.py

      - name: Verify package contents and hashes
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -name 'CITADEL_FIXED_AGENT_*' | head -n 1)"
          package_zip="${package_dir}.zip"
          test -n "$package_dir"
          test -f "$package_zip"
          python -m py_compile "$package_dir/citadel_node_v1.py" "$package_dir/citadel_node_v2.py"
          python "$package_dir/citadel_node_v2.py" self-test
          python - "$package_dir" <<'PY'
          from pathlib import Path
          import hashlib, sys
          root = Path(sys.argv[1])
          required = {
              "citadel_node_v1.py", "citadel_node_v2.py", "requirements.txt",
              "setup_windows.ps1", "Install Windows Node.cmd", "START_HERE.cmd",
              "README_RU.txt", "VERIFY_PACKAGE.ps1"
          }
          seen = set()
          for line in (root / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, name = line.split("  ", 1)
              path = root / name
              assert path.is_file(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              seen.add(name)
          assert required <= seen, sorted(required - seen)
          installer = (root / "Install Windows Node.cmd").read_text(encoding="utf-8").lower()
          setup = (root / "setup_windows.ps1").read_text(encoding="utf-8").lower()
          assert "executionpolicy bypass" not in installer
          assert "executionpolicy bypass" not in setup
          assert "invoke-webrequest" not in setup
          print("Package manifest, offline source and installer policy: OK")
          PY
          unzip -t "$package_zip"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: CITADEL-Windows-Agent-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
