name: Legacy 0.3.1 update bridge test
on:
  push:
    branches:
      - release/legacy-031-update-bridge
permissions:
  contents: read
jobs:
  bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: 64139abefcbc8daf161dc34a896163f52f899469
          path: target-current
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install legacy 0.3.1 runtime dependencies only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=50.0.1,<51" "psutil>=5.9,<8"
      - name: Prove bridge can be staged by 0.3.1
        shell: pwsh
        run: |
          python agent\citadel_node_v2.py self-test
      - name: Prove bridge activates current agent through Controller probe
        shell: pwsh
        run: |
          @'
          import hashlib
          import http.server
          import json
          import shutil
          import sys
          import tempfile
          import threading
          from pathlib import Path

          repo = Path.cwd()
          target = repo / "target-current" / "agent"
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              install = root / "install"
              data = root / "state"
              install.mkdir()
              data.mkdir()
              for name in ("citadel_node_v1.py", "citadel_node_v2.py"):
                  shutil.copy2(repo / "agent" / name, install / name)

              class Handler(http.server.BaseHTTPRequestHandler):
                  def log_message(self, *_):
                      pass
                  def _json(self, payload):
                      body = json.dumps(payload).encode()
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def do_POST(self):
                      length = int(self.headers.get("Content-Length", "0"))
                      if length:
                          self.rfile.read(length)
                      if self.path == "/api/v1/enroll":
                          self._json({"node": {"node_id": "node_bridge_test", "node_number": 1}})
                      elif self.path == "/api/v1/nodes/node_bridge_test/heartbeat":
                          self._json({"ok": True, "node_status": "online"})
                      else:
                          self.send_error(404)

              server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Handler)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  config_path = root / "config.json"
                  config_path.write_text(json.dumps({
                      "controller_url": f"http://127.0.0.1:{server.server_port}",
                      "data_dir": str(data),
                      "poll_seconds": 30,
                      "heartbeat_seconds": 30,
                      "request_timeout_seconds": 10
                  }), encoding="utf-8")

                  sys.path.insert(0, str(install))
                  import citadel_node_v1 as bridge
                  config = bridge.AgentConfig.from_file(config_path)
                  agent = bridge.Agent(config, config_path)

                  files = []
                  blobs = {}
                  for name in ("citadel_node_v1.py", "citadel_node_v2.py"):
                      body = (target / name).read_bytes()
                      url = "https://raw.githubusercontent.com/citadel-AI-EWS/EWS/64139abefcbc8daf161dc34a896163f52f899469/agent/" + name
                      files.append({"path": name, "url": url, "sha256": hashlib.sha256(body).hexdigest()})
                      blobs[url] = body
                  agent.download_update_file = lambda url: blobs[url]
                  agent.apply_update({"version": "0.3.39", "files": files})

                  installed = (install / "citadel_node_v2.py").read_text(encoding="utf-8")
                  assert 'VERSION = "0.3.39"' in installed
                  log = (data / "agent.jsonl").read_text(encoding="utf-8")
                  assert '"event": "agent_update_healthcheck_passed"' in log
                  assert '"phase": "controller_probe"' in log
                  print("legacy 0.3.1 bridge -> current probe activation: PASS")
              finally:
                  server.shutdown()
                  server.server_close()
          '@ | python -
