name: One-time Copilot audit for PR 138

on:
  pull_request:
    types: [synchronize, opened, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  audit:
    if: github.event.pull_request.number == 138
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Build audit prompt
        shell: bash
        run: |
          cat > /tmp/copilot-audit.txt <<'PROMPT'
          You are the independent second engineer/reviewer for CITADEL/EWS.

          Review PR #138 and its current branch:
          feature/parallel-llm-miniagents-copilot-bridge-20260926

          Compare the current checked-out PR head with main.

          DO NOT modify files.
          DO NOT create commits.
          DO NOT create another PR.
          DO NOT publish a release.

          1. PARALLEL LLM MINI-AGENTS

          The current implementation is intended to contain:
          - bounded ThreadPoolExecutor;
          - 1-3 LLM mini-agents;
          - worker count from task complexity;
          - concurrency bounds from RAM / available RAM / GPU VRAM;
          - independent parallel LLM calls;
          - per-call timeout;
          - total timeout;
          - deterministic result ordering;
          - synthesis after available results;
          - first mini-agent is not a single point of failure;
          - failed parallel workers can retry at concurrency=1;
          - mini-agent telemetry.

          Inspect actual code, not PR prose.

          Try to find:
          - race conditions;
          - deadlocks;
          - incorrect timeout behavior;
          - Futures that can hang;
          - shutdown(wait=True) defeating the total timeout;
          - bad fallback logic;
          - successful workers being rerun;
          - OOM risk;
          - wrong VRAM/resource logic;
          - wrong deterministic ordering;
          - synthesis errors after partial success.

          2. TESTS

          Inspect tests/llm-miniagents-parallel.py.

          It should prove:
          A. short task -> one mini-agent;
          B. complex task -> multiple mini-agents actually overlap in time;
          C. secondary mini-agent failure still permits synthesis from survivors;
          D. first mini-agent failure still permits completion from survivors.

          Do not treat ThreadPoolExecutor existence as proof of overlap.
          time.monotonic() uses seconds, not milliseconds.
          Check whether the current Barrier-based test actually proves overlap reliably.

          3. FAILURE HANDLING

          Previous plan had a contradiction: it required the first agent not to be an SPoF, but also said first-agent failure should abort.
          Current implementation should remove that SPoF. Verify code and tests.

          4. LM STUDIO DEGRADATION

          Verify this intended path:
          3 concurrent workers
          -> LM Studio cannot sustain concurrency
          -> one or more requests fail
          -> only failed workers retry serially
          -> already successful workers do not rerun
          -> retry uses only remaining TOTAL timeout budget
          -> synthesis uses all available results.

          5. TELEMETRY

          Verify new LLM mini-agent events are allowed consistently in both agent telemetry and Worker-side normalization.
          Look for mismatched event names.

          6. RELEASE / HASH INTEGRITY

          Verify SHA-256 pins, setup_windows.ps1, setup_linux.sh, LATEST_NODE_RELEASE, package integrity checks, and that this PR does not silently replace the published agent without integrity updates.
          Do not suggest bypassing hash checks.

          7. COPILOT FREE CLOUD BRIDGE

          Inspect .github/workflows/copilot-independent-review.yml.

          Goal:
          ChatGPT -> GitHub Issue [COPILOT REVIEW] -> GitHub Actions -> Copilot CLI -> independent review -> comment to Issue -> ChatGPT reads it.

          The user works only from a phone.

          The solution must not require:
          - Windows PC;
          - local daemon;
          - PAT;
          - manual copy/paste;
          - permanent local process.

          Check workflow security:
          - issue author must be repository owner;
          - contents: read;
          - issues: write;
          - copilot-requests: write;
          - REF validation;
          - no write tool;
          - no git push;
          - no arbitrary shell/network/package-manager commands available to Copilot.

          Try specifically to find a prompt-injection path through Issue body that could escape the intended read-only review boundary.

          8. DO NOT REPEAT CORRECTED FALSE FINDINGS

          Already verified previously:
          - src/quality/openrouter.js exists;
          - OpenRouter integration exists;
          - query_answer is displayed in Hub;
          - Windows installer migrates identity;
          - LM Studio protocol test uses an internal mock server.

          Only raise these again if this PR introduces a real regression.

          Return exactly:

          PR #138 REVIEW

          CONFIRMED

          REAL BUGS

          RACE / CONCURRENCY RISKS

          SECURITY RISKS

          TEST WEAKNESSES

          NOT VERIFIED

          VERDICT:
          PASS / PARTIAL PASS / FAIL

          Your primary task is to try to break the current implementation and find what ChatGPT missed.
          PROMPT

      - name: Run Copilot audit
        id: copilot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          copilot \
            -p "$(cat /tmp/copilot-audit.txt)" \
            -s \
            --no-ask-user \
            --no-color \
            --allow-tool=read \
            --allow-tool='shell(git status)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git show:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git rev-parse:*)' \
            --deny-tool=write \
            > /tmp/copilot-result.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post Copilot result to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COPILOT_EXIT_CODE: ${{ steps.copilot.outputs.exit_code }}
        run: |
          {
            echo '<!-- one-time-copilot-pr138-audit -->'
            echo '## Copilot independent audit'
            echo
            echo "Exit code: `$COPILOT_EXIT_CODE`"
            echo
            tail -c 55000 /tmp/copilot-result.txt
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/comment.md

      - name: Fail if Copilot failed
        if: steps.copilot.outputs.exit_code != '0'
        run: exit 1
